# Production Dependabot: split groups so Expo/RN/Firebase stay reviewable.
# See DEPENDABOT.md for details.

version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: deps
      include: scope
    # Pin toolchain majors that break Expo/eslint-config-expo today.
    ignore:
      - dependency-name: "typescript"
        versions: ["> 6.0.3"]
      # eslint-plugin-react (via eslint-config-expo) is not ESLint 10-ready yet.
      - dependency-name: "eslint"
        versions: [">= 10"]
      # Stay on Expo SDK 57; allow 57.x patches/minors only (no auto SDK 58+).
      - dependency-name: "expo"
        versions: [">= 58"]
      - dependency-name: "expo-*"
        versions: [">= 58"]
      - dependency-name: "eslint-config-expo"
        versions: [">= 58"]
    groups:
      expo-sdk:
        patterns:
          - "expo"
          - "expo-*"
          - "eslint-config-expo"
      react-native:
        patterns:
          - "react"
          - "react-dom"
          - "react-native"
          - "react-native-*"
          - "@react-native*"
      firebase:
        patterns:
          - "firebase"
          - "firebase-tools"
          - "@firebase/*"
      fonts:
        patterns:
          - "@expo-google-fonts/*"
      lint-and-test:
        patterns:
          - "eslint"
          - "eslint-*"
          - "vitest"
          - "@types/*"
      other-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
