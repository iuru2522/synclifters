# Production Dependabot: split groups so Expo/RN/Firebase stay reviewable.
# See DEPENDABOT.md for details.

version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: deps
      include: scope
    groups:
      expo-sdk:
        patterns:
          - "expo"
          - "expo-*"
          - "eslint-config-expo"
      react-native:
        patterns:
          - "react"
          - "react-dom"
          - "react-native"
          - "react-native-*"
          - "@react-native*"
      firebase:
        patterns:
          - "firebase"
          - "firebase-tools"
          - "@firebase/*"
      fonts:
        patterns:
          - "@expo-google-fonts/*"
      lint-and-test:
        patterns:
          - "eslint"
          - "eslint-*"
          - "typescript"
          - "vitest"
          - "@types/*"
      other-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
